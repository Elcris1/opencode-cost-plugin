name: Bug report
description: Report something that goes wrong when installing or using the plugin.
labels: [bug]
body:
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Run `opencode --version` and enter the result.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      description: Enter the installed version or the commit if you installed from source. If unsure, describe how you installed it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe what you did step by step. Include the provider and model if they matter.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: What happened, and what did you expect to happen? For incorrect pricing, include the rates you saw and the rates you expected.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Environment and diagnostics
      description: >-
        If relevant, include your OS, terminal app and width in columns, a screenshot, a short config snippet,
        or a relevant excerpt from `~/.local/share/opencode/log/opencode.log`. Remove API keys,
        tokens, and private URLs before posting.
